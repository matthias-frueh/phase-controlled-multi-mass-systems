# Automatischer Testlauf für Pull Requests gegen main.
#
# Der Lauf führt die Testsuite in tests/ in einer frischen Linux-Umgebung aus, mit dem Testbefehl aus dem
# README (Abschnitt „Nachrechnen“). Grün heißt: Die Softwaretests sind bestanden. Eine wissenschaftliche
# Bestätigung ist das nicht; alles im Repository ist Simulation oder Analytik.
#
# Der Lauf ändert keine Dateien und führt keinen Merge aus. Eine Merge-Sperre ist damit nicht eingerichtet.
#
# Umgebung: Die Abhängigkeiten stehen in code/requirements.txt ohne Versionsangabe; welche Versionen der Lauf
# installiert, legt .github/constraints-ci.txt fest. Das Betriebssystem ist auf Ubuntu 24.04 festgelegt, weil
# vier Tests SHA-256-Prüfsummen über komprimierte NPZ-Bytes vergleichen und das Ergebnis der Kompression vom
# zlib des Systems abhängt: Mit zlib 1.3 (Ubuntu 24.04) entstehen die hinterlegten Prüfsummen, mit zlib-ng
# nicht. Welche Versionen im einzelnen Lauf galten, hält der Schritt „Umgebung protokollieren“ fest.

name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: python3 -m pip install -r code/requirements.txt -c .github/constraints-ci.txt

      - name: Umgebung protokollieren
        run: |
          python3 --version
          python3 -c "import zlib; print('zlib', zlib.ZLIB_RUNTIME_VERSION)"
          python3 -m pip list

      - name: Testsuite ausführen
        run: python3 -m pytest tests -q
