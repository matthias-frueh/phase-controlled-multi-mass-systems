# Automatischer Testlauf für Pull Requests gegen main.
#
# Der Lauf führt die Testsuite in tests/ in einer frischen Linux-Umgebung aus, mit dem Testbefehl aus dem
# README (Abschnitt „Nachrechnen“). Grün heißt: Die Softwaretests sind bestanden. Eine wissenschaftliche
# Bestätigung ist das nicht; alles im Repository ist Simulation oder Analytik.
#
# Der Lauf ändert keine Dateien und führt keinen Merge aus. Eine Merge-Sperre ist damit nicht eingerichtet.
#
# Umgebung: Die Abhängigkeiten stehen in code/requirements.txt ohne Versionsangabe; welche Versionen der Lauf
# installiert, legt .github/constraints-ci.txt fest. Das Betriebssystem ist auf Ubuntu 24.04 festgelegt, damit
# der Lauf in einer benannten Umgebung rechnet. Was im einzelnen Lauf galt, hält der Schritt „Umgebung
# protokollieren“ fest.
#
# Rechenkern und Thread-Zahl sind seit dem 14.11.2026 nicht mehr festgelegt, und kein Test ist abgewählt. GitHub
# teilt Runner mit verschiedenen Prozessoren zu; OpenBLAS und NumPy wählen ihre Rechenwege nach dem Prozessor,
# und die Ergebnisse unterscheiden sich dann im Rundungsrauschen. Die Tests vergleichen deshalb exakte Inhalte
# (Köpfe, Entscheidungen, Seeds, Zählgrößen) exakt und berechnete Zahlenfelder mit Toleranz
# (code/pcmms_auswertung/kennwerte.py; Untersuchung in docs/kennwerte_untersuchung_2026-11-13/). Die
# Übergangslösung vom 12.11.2026 (Rechenkern HASWELL, ein BLAS-Thread, drei abgewählte Tests) ist damit
# aufgehoben. Die hinterlegten Prüfsummen berechneter Felder gelten nur für die Umgebung ihrer Erzeugung
# (Rechenkern SkylakeX, zlib 1.3); dass sie dort bitgleich wiederkehren, prüfen die Tests nur auf Verlangen
# (PCMMS_BITGLEICH=1), nicht in diesem Lauf.

name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: python3 -m pip install -r code/requirements.txt -c .github/constraints-ci.txt

      - name: Umgebung protokollieren
        run: |
          echo "Prozessor: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//') ($(nproc) Kerne)"
          if grep -qw avx512f /proc/cpuinfo; then echo "AVX-512: ja"; else echo "AVX-512: nein"; fi
          echo "Festgelegt: nichts (OPENBLAS_CORETYPE='${OPENBLAS_CORETYPE:-}', OPENBLAS_NUM_THREADS='${OPENBLAS_NUM_THREADS:-}')"
          python3 --version
          python3 -c "import zlib; print('zlib', zlib.ZLIB_RUNTIME_VERSION)"
          python3 -m pip list
          # threadpoolctl liest Rechenkern und Thread-Zahl aus; es liegt außerhalb der Testumgebung
          python3 -m pip install -q --target "$RUNNER_TEMP/protokoll" -c .github/constraints-ci.txt threadpoolctl
          PYTHONPATH="$RUNNER_TEMP/protokoll" python3 - <<'PY'
          import numpy, scipy.linalg
          from threadpoolctl import threadpool_info
          for b in threadpool_info():
              ort = b["filepath"].split("/site-packages/")[-1]
              print(f"BLAS: {b['internal_api']} {b['version']}, Kern {b.get('architecture')}, Threads {b['num_threads']} ({ort})")
          PY

      - name: Testsuite ausführen
        run: python3 -m pytest tests -q
